name: CI-Pipeline

on:
  push:
    branches:
      - dev
      - stage
      - prod
      - main

  pull_request:
    branches:
      - dev
      - stage
      - prod
      - main

permissions:
  contents: read

jobs:

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm i

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build


  backend:
    name: Backend validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build


  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frontend production image
        run: |
          docker build \
            -f frontend/Dockerfile.prod \
            --build-arg VITE_API_URL=http://localhost:5000 \
            --build-arg VITE_SOCKET_URL=http://localhost:5000 \
            -t frontend:test \
            frontend

      - name: Build backend production image
        run: |
          docker build \
            -f backend/Dockerfile.prod \
            -t backend:test \
            backend