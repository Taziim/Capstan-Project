name: Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:

  deploy:
    runs-on: ubuntu-latest

    environment:
      name: development

    steps:

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: |
          SHA=$(git rev-parse --short HEAD)

          echo "SHA=$SHA" >> "$GITHUB_OUTPUT"
          echo "TAG=dev-$SHA" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        run: |
          docker build \
            -f frontend/Dockerfile.prod \
            --build-arg VITE_API_URL="${{ vars.DEV_API_URL }}" \
            --build-arg VITE_SOCKET_URL="${{ vars.DEV_SOCKET_URL }}" \
            -t ghcr.io/${{ github.repository_owner }}/support-chat-frontend:${{ steps.vars.outputs.TAG }} \
            frontend

      - name: Build backend
        run: |
          docker build \
            -f backend/Dockerfile.prod \
            -t ghcr.io/${{ github.repository_owner }}/support-chat-backend:${{ steps.vars.outputs.TAG }} \
            backend

      - name: Push images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/support-chat-frontend:${{ steps.vars.outputs.TAG }}
          docker push ghcr.io/${{ github.repository_owner }}/support-chat-backend:${{ steps.vars.outputs.TAG }}

      - name: Update Kubernetes manifests
        run: |
          sed -i \
            "s|image: ghcr.io/.*/support-chat-frontend:.*|image: ghcr.io/${{ github.repository_owner }}/support-chat-frontend:${{ steps.vars.outputs.TAG }}|" \
            k8s/dev/frontend-deployment.yaml

          sed -i \
            "s|image: ghcr.io/.*/support-chat-backend:.*|image: ghcr.io/${{ github.repository_owner }}/support-chat-backend:${{ steps.vars.outputs.TAG }}|" \
            k8s/dev/backend-deployment.yaml

      - name: Commit GitOps change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/dev

          git commit \
            -m "chore(dev): deploy ${{ steps.vars.outputs.TAG }}" \
            || echo "No manifest changes"

          git push origin dev