name: Deploy Stage

on:
  push:
    branches: [stage]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:

  deploy:
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      - name: Checkout stage
        uses: actions/checkout@v4
        with:
          ref: stage

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version
        id: version
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "TAG=stage-$SHA" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        run: |
          docker build \
            -f frontend/Dockerfile.prod \
            --build-arg VITE_API_URL="${{ vars.STAGE_API_URL }}" \
            --build-arg VITE_SOCKET_URL="${{ vars.STAGE_SOCKET_URL }}" \
            -t ghcr.io/${{ github.repository_owner }}/support-chat-frontend:${{ steps.version.outputs.TAG }} \
            frontend

      - name: Build backend
        run: |
          docker build \
            -f backend/Dockerfile.prod \
            -t ghcr.io/${{ github.repository_owner }}/support-chat-backend:${{ steps.version.outputs.TAG }} \
            backend

      - name: Push images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/support-chat-frontend:${{ steps.version.outputs.TAG }}
          docker push ghcr.io/${{ github.repository_owner }}/support-chat-backend:${{ steps.version.outputs.TAG }}

      - name: Update manifests
        run: |
          sed -i \
            "s|image: ghcr.io/.*/support-chat-frontend:.*|image: ghcr.io/${{ github.repository_owner }}/support-chat-frontend:${{ steps.version.outputs.TAG }}|" \
            k8s/stage/frontend-deployment.yaml

          sed -i \
            "s|image: ghcr.io/.*/support-chat-backend:.*|image: ghcr.io/${{ github.repository_owner }}/support-chat-backend:${{ steps.version.outputs.TAG }}|" \
            k8s/stage/backend-deployment.yaml

      - name: Commit GitOps change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/stage

          git commit \
            -m "chore(stage): deploy ${{ steps.version.outputs.TAG }}" \
            || echo "No changes"

          git push origin stage